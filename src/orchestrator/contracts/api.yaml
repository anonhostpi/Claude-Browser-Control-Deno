# Browser Control API Contracts
#
# URL Pattern: /:endpoint/:context/:target/:node
#
# Unified routing - handler determines mode based on :endpoint value:
# - Known browsers (chrome, edge, firefox, brave, chromium, opera, vivaldi):
#   - endpoint = browser type, context = profile name
# - Unknown (hosts):
#   - endpoint = host address, context = port number
#
# Method semantics:
# - HEAD: Health/existence checks
# - GET: Queries and informational data (or WebSocket upgrade)
# - POST: Browser/media control actions
# - PUT: Content/DOM control
# - PATCH: Update operations
# - DELETE: Deletion/cleanup operations
#
# Request body takes precedence over URL params when present.
# In absence of body, URL params are used for input.

contracts:
  # Root Level - /
  - $include: ./root.yaml

  # Endpoint Level - /:endpoint (browser type OR host)
  - $include: ./endpoint.yaml

  # Context Level - /:endpoint/:context (profile OR port)
  - $include: ./context.yaml

  # Target Level - /:endpoint/:context/:target
  - $include: ./target.yaml

  # Node Level - /:endpoint/:context/:target/:node
  - $include: ./node.yaml
