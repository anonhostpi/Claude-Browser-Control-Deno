# Target Level Contracts - /:endpoint/:context/:target
# Tab/page management
#
# Method semantics:
# - GET: WebSocket upgrade (CDP passthrough) or target info
# - POST: Browser/media control (navigate, refresh, play, pause, volume)
# - PUT: Content control (document, permissions, certificates, navigator APIs)
# - PATCH: Update target properties
# - DELETE: Close target

# WebSocket upgrade for CDP passthrough - MUST BE FIRST
# Detected via Upgrade header, not request body
- name: target:cdp
  path: /:endpoint/:context/:target
  method: GET
  websocket: true
  description: WebSocket for direct CDP access, or GET for WebSocket URL
  module: src/routes/target/cdp.ts
  response:
    type: object
    properties:
      ws:
        type: string
        description: WebSocket URL for CDP connection
    required: [ws]

- name: target:exists
  path: /:endpoint/:context/:target
  method: HEAD
  description: Check if target exists
  module: src/routes/target/exists.ts
  response:
    type: "null"

- name: target:info
  path: /:endpoint/:context/:target
  method: GET
  description: Get target info or query nodes
  module: src/routes/target/info.ts
  request:
    type: object
    properties:
      xpath:
        type: string
        description: XPath query to find nodes
      css:
        type: string
        description: CSS selector query to find nodes
  response:
    type: object
    properties:
      id:
        type: string
      type:
        type: string
      title:
        type: string
      url:
        type: string
      webSocketDebuggerUrl:
        type: string
      nodes:
        type: array
        description: Present when xpath or css query is provided
        items:
          type: object
          properties:
            nodeId:
              type: integer
            nodeName:
              type: string
            nodeType:
              type: integer
          required: [nodeId, nodeName, nodeType]
    required: [id, type, title, url]

# POST = Browser/media control
- name: target:control
  path: /:endpoint/:context/:target
  method: POST
  description: Browser and media control actions
  module: src/routes/target/control.ts
  request:
    type: object
    properties:
      # Navigation
      navigate:
        type: string
        description: Navigate to URL
      refresh:
        type: boolean
        description: Refresh the page
      back:
        type: boolean
        description: Navigate back
      forward:
        type: boolean
        description: Navigate forward
      # Media control
      play:
        type: boolean
        description: Play media
      pause:
        type: boolean
        description: Pause media
      mute:
        type: boolean
        description: Mute audio
      volume:
        type: number
        minimum: 0
        maximum: 1
        description: Set volume (0-1)
      # Tab control
      activate:
        type: boolean
        description: Bring target to foreground
      # Script execution
      script:
        type: string
        description: Execute JavaScript
      # Screenshot
      screenshot:
        type: object
        properties:
          format:
            type: string
            enum: [png, jpeg, webp]
          quality:
            type: integer
            minimum: 0
            maximum: 100
          fullPage:
            type: boolean
  response:
    type: object
    description: Response varies by action

- name: target:create
  path: /:endpoint/:context/:target
  method: POST
  description: Create new target (tab)
  module: src/routes/target/create.ts
  request:
    type: object
    properties:
      url:
        type: string
        description: URL to open in new target
    required: [url]
  response:
    type: object
    properties:
      id:
        type: string
      type:
        type: string
      title:
        type: string
      url:
        type: string
    required: [id, type, title, url]

# PUT = Content control (DOM, permissions, navigator APIs)
- name: target:content
  path: /:endpoint/:context/:target
  method: PUT
  description: Content and document control
  module: src/routes/target/content.ts
  request:
    type: object
    properties:
      # Document replacement
      document:
        type: string
        description: Replace document with HTML content
      # Permissions
      permissions:
        type: object
        description: Override permissions
        properties:
          geolocation:
            type: string
            enum: [granted, denied, prompt]
          notifications:
            type: string
            enum: [granted, denied, prompt]
          camera:
            type: string
            enum: [granted, denied, prompt]
          microphone:
            type: string
            enum: [granted, denied, prompt]
          clipboard-read:
            type: string
            enum: [granted, denied, prompt]
          clipboard-write:
            type: string
            enum: [granted, denied, prompt]
      # Certificates
      certificates:
        type: object
        properties:
          ignore:
            type: boolean
            description: Ignore certificate errors
      # Cookies
      cookies:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
            value:
              type: string
            domain:
              type: string
            path:
              type: string
            expires:
              type: number
            httpOnly:
              type: boolean
            secure:
              type: boolean
            sameSite:
              type: string
              enum: [Strict, Lax, None]
          required: [name, value]
      # Navigator API overrides
      navigator:
        type: object
        properties:
          # Geolocation mock
          geolocation:
            type: object
            properties:
              latitude:
                type: number
              longitude:
                type: number
              accuracy:
                type: number
            required: [latitude, longitude]
          # Clipboard
          clipboard:
            type: object
            properties:
              text:
                type: string
                description: Write text to clipboard
          # Media devices mock
          mediaDevices:
            type: object
            properties:
              mock:
                type: array
                items:
                  type: object
                  properties:
                    deviceId:
                      type: string
                    kind:
                      type: string
                      enum: [audioinput, audiooutput, videoinput]
                    label:
                      type: string
                  required: [deviceId, kind, label]
          # User agent override
          userAgent:
            type: string
          # Language override
          language:
            type: string
          # Platform override
          platform:
            type: string
          # Hardware concurrency override
          hardwareConcurrency:
            type: integer
          # Device memory override
          deviceMemory:
            type: number
          # Online status
          onLine:
            type: boolean
          # Bluetooth mock
          bluetooth:
            type: object
            properties:
              available:
                type: boolean
          # USB mock
          usb:
            type: object
            properties:
              devices:
                type: array
                items:
                  type: object
          # Serial mock
          serial:
            type: object
            properties:
              ports:
                type: array
                items:
                  type: object
  response:
    type: object
    properties:
      success:
        type: boolean
      applied:
        type: array
        items:
          type: string
        description: List of applied changes
    required: [success]

# PATCH = Partial updates to target properties/settings
# Emulation settings
- name: target:emulate
  path: /:endpoint/:context/:target
  method: PATCH
  description: Device and viewport emulation settings
  module: src/routes/target/emulate.ts
  request:
    type: object
    properties:
      # Viewport
      viewport:
        type: object
        properties:
          width:
            type: integer
            minimum: 1
            description: Viewport width in pixels
          height:
            type: integer
            minimum: 1
            description: Viewport height in pixels
          deviceScaleFactor:
            type: number
            minimum: 0
            description: Device scale factor (DPR)
          isMobile:
            type: boolean
            description: Enable mobile emulation
          hasTouch:
            type: boolean
            description: Enable touch events
          isLandscape:
            type: boolean
            description: Landscape orientation
      # Device presets
      device:
        type: string
        description: Device preset name (e.g., "iPhone 14", "Pixel 7")
      # Color scheme
      colorScheme:
        type: string
        enum: [light, dark, no-preference]
        description: Preferred color scheme
      # Reduced motion
      reducedMotion:
        type: string
        enum: [reduce, no-preference]
        description: Reduced motion preference
      # Forced colors
      forcedColors:
        type: string
        enum: [active, none]
        description: Forced colors mode
      # Timezone
      timezone:
        type: string
        description: Timezone ID (e.g., "America/New_York")
      # Locale
      locale:
        type: string
        description: Locale (e.g., "en-US")
      # Geolocation
      geolocation:
        type: object
        properties:
          latitude:
            type: number
            minimum: -90
            maximum: 90
          longitude:
            type: number
            minimum: -180
            maximum: 180
          accuracy:
            type: number
            minimum: 0
        required: [latitude, longitude]
  response:
    type: object
    properties:
      success:
        type: boolean
      applied:
        type: array
        items:
          type: string
    required: [success]

# Network throttling
- name: target:throttle
  path: /:endpoint/:context/:target
  method: PATCH
  description: Network and CPU throttling for performance testing
  module: src/routes/target/throttle.ts
  request:
    type: object
    properties:
      # Network conditions
      network:
        type: object
        properties:
          offline:
            type: boolean
            description: Simulate offline mode
          latency:
            type: number
            minimum: 0
            description: Additional latency in milliseconds
          downloadThroughput:
            type: number
            minimum: -1
            description: Download speed in bytes/sec (-1 for no throttle)
          uploadThroughput:
            type: number
            minimum: -1
            description: Upload speed in bytes/sec (-1 for no throttle)
          connectionType:
            type: string
            enum: [none, cellular2g, cellular3g, cellular4g, bluetooth, ethernet, wifi, wimax, other]
            description: Connection type hint
      # Network presets
      networkPreset:
        type: string
        enum: [fast-3g, slow-3g, offline, no-throttle]
        description: Network throttling preset
      # CPU throttling
      cpuThrottling:
        type: number
        minimum: 1
        description: CPU slowdown factor (e.g., 4 = 4x slower)
  response:
    type: object
    properties:
      success:
        type: boolean
      network:
        type: object
        properties:
          offline:
            type: boolean
          latency:
            type: number
          downloadThroughput:
            type: number
          uploadThroughput:
            type: number
      cpuThrottling:
        type: number
    required: [success]

# Request interception
- name: target:intercept
  path: /:endpoint/:context/:target
  method: PATCH
  description: Request interception and modification rules
  module: src/routes/target/intercept.ts
  request:
    type: object
    properties:
      # Blocked URLs (patterns)
      blocked:
        type: array
        items:
          type: string
        description: URL patterns to block (supports wildcards)
      # Header modifications
      headers:
        type: object
        properties:
          add:
            type: object
            additionalProperties:
              type: string
            description: Headers to add to all requests
          remove:
            type: array
            items:
              type: string
            description: Header names to remove from all requests
          override:
            type: object
            additionalProperties:
              type: string
            description: Headers to override in all requests
      # Response mocking rules
      mock:
        type: array
        items:
          type: object
          properties:
            urlPattern:
              type: string
              description: URL pattern to match
            status:
              type: integer
              description: Response status code
            headers:
              type: object
              additionalProperties:
                type: string
            body:
              type: string
              description: Response body
            contentType:
              type: string
              description: Content-Type header shorthand
          required: [urlPattern]
      # Clear all interception rules
      clear:
        type: boolean
        description: Clear all interception rules
  response:
    type: object
    properties:
      success:
        type: boolean
      rules:
        type: object
        properties:
          blocked:
            type: integer
          headers:
            type: integer
          mocks:
            type: integer
    required: [success]

# Metadata/labeling
- name: target:label
  path: /:endpoint/:context/:target
  method: PATCH
  description: Target metadata and labeling for organization
  module: src/routes/target/label.ts
  request:
    type: object
    properties:
      # Custom title (doesn't change actual page title)
      displayName:
        type: string
        description: Custom display name for the target
      # Tags for grouping/filtering
      tags:
        type: array
        items:
          type: string
        description: Tags for categorization
      # Custom metadata
      metadata:
        type: object
        additionalProperties: true
        description: Arbitrary key-value metadata
      # Color coding
      color:
        type: string
        description: Color for visual identification (hex or name)
      # Group assignment
      group:
        type: string
        description: Group name for organizing targets
  response:
    type: object
    properties:
      success:
        type: boolean
      displayName:
        type: string
      tags:
        type: array
        items:
          type: string
      metadata:
        type: object
      color:
        type: string
      group:
        type: string
    required: [success]

- name: target:close
  path: /:endpoint/:context/:target
  method: DELETE
  description: Close target (tab)
  module: src/routes/target/close.ts
  response:
    type: "null"
