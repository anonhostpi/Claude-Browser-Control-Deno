# Instance Level Contracts - /:browser/:profile
# Browser instance management

- name: instance:exists
  path: /:browser/:profile
  method: HEAD
  description: Check if browser instance is running
  module: instance/exists.ts
  response:
    type: "null"

- name: instance:info
  path: /:browser/:profile
  method: GET
  description: Get instance info and list of targets
  module: instance/info.ts
  response:
    type: object
    properties:
      browser:
        type: string
      profile:
        type: string
      port:
        type: integer
      wsEndpoint:
        type: string
      createdAt:
        type: string
        format: date-time
      targets:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
            type:
              type: string
            title:
              type: string
            url:
              type: string
          required: [id, type, title, url]
    required: [browser, profile, port, wsEndpoint, createdAt, targets]

- name: instance:create
  path: /:browser/:profile
  method: POST
  description: Create/launch browser instance
  module: instance/create.ts
  request:
    type: object
    properties:
      headless:
        type: boolean
        default: false
      port:
        type: integer
        description: Optional debugging port
  response:
    type: object
    properties:
      browser:
        type: string
      profile:
        type: string
      port:
        type: integer
      wsEndpoint:
        type: string
      created:
        type: boolean
    required: [browser, profile, port, wsEndpoint, created]

- name: instance:close
  path: /:browser/:profile
  method: DELETE
  description: Close browser instance
  module: instance/close.ts
  response:
    type: "null"
